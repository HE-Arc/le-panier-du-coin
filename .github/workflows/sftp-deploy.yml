name: Deploy via SFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # exemple d'assets a exec (dependences)
      # - name: Install Node dependencies and build
      #   run: |
      #     npm install
      #     npm run build

      # envoi via ftp
      - name: Copy files to remote server via SCP/SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          
          # tout le projet
          source: "."
          
          # explicit
          target: "/home/laravel/project/ebay_project/public/"
          
          # A ignorer
          ignore: |
            .git
            .github
            .env
            node_modules
            tests
